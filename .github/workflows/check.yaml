name: "check"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  run:
    runs-on: "ubuntu-22.04"
    steps:
      - uses: "actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26" # v3.7.0
      - run: "make check"
